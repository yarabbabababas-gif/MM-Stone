  <meta name="description" content="Malvigano Mac Pvt. Ltd. - Specialists in processing and export of premium granite, marble, engineered quartz, porcelain slabs, and monumental stones. Units in Hosur & Chennai.">

  <style>
    :root {
      --brand-navy: #003366;
      --brand-navy-dark: #002244;
      --brand-navy-deep: #0b1a2b;
      --brand-slate: #2b3a4a;
      --brand-gold: #c5a059;
      --brand-gold-light: #dfbe7d;
      --brand-accent: #b32d2d;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --bg-cream: #fbfbfd;
      --card-border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-soft: 0 10px 30px -5px rgba(0, 51, 102, 0.08);
      --shadow-hover: 0 20px 40px -10px rgba(0, 51, 102, 0.16);
      --transition: all 0.25s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-cream);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .font-serif { font-family: 'Cinzel', Georgia, serif; }
    a { text-decoration: none; color: inherit; }

    /* --- TOP STRIP --- */
    .top-strip {
      background: var(--brand-slate);
      color: #cbd5e1;
      font-size: 13px;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .top-strip-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .top-contacts {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .top-contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-weight: 500;
    }
    .top-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--brand-gold-light);
      background: rgba(197, 160, 89, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      white-space: nowrap;
    }

    /* --- NAVIGATION & MOBILE DRAWER --- */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo-wrap { display: flex; align-items: center; gap: 12px; }
    
    /* Logo Image Style */
    .brand-logo-img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 50%;
      border: 1.5px solid var(--brand-gold);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
      background-color: #ffffff;
    }
    .brand-logo-img.footer-logo {
      width: 42px;
      height: 42px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-navy);
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-weight: 600;
      font-size: 14px;
      color: var(--brand-slate);
    }
    .nav-links a:hover { color: var(--brand-navy); }
    .btn-nav-quote {
      background: var(--brand-navy);
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: var(--transition);
    }
    .btn-nav-quote:hover {
      background: var(--brand-navy-dark);
    }
    .nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--brand-navy);
    }

    /* Mobile Drawer */
    .mobile-menu {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 16px 20px 24px 20px;
      background: #ffffff;
      border-top: 1px solid var(--card-border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
    }
