<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>MalviganoMac Stone | Natural Stone, Granite, Marble & Quartz Exporters</title>
  <meta name="description" content="Malvigano Mac Pvt. Ltd. - Specialists in processing and export of premium granite, marble, engineered quartz, porcelain slabs, and monumental stones. Units in Hosur & Chennai.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-navy: #003366;
      --brand-navy-dark: #002244;
      --brand-navy-deep: #0b1a2b;
      --brand-slate: #2b3a4a;
      --brand-gold: #c5a059;
      --brand-gold-light: #dfbe7d;
      --brand-accent: #b32d2d;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --bg-cream: #fbfbfd;
      --card-border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-soft: 0 10px 30px -5px rgba(0, 51, 102, 0.08);
      --shadow-hover: 0 20px 40px -10px rgba(0, 51, 102, 0.16);
      --transition: all 0.25s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-cream);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .font-serif { font-family: 'Cinzel', Georgia, serif; }
    a { text-decoration: none; color: inherit; }

    /* --- TOP STRIP --- */
    .top-strip {
      background: var(--brand-slate);
      color: #cbd5e1;
      font-size: 13px;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .top-strip-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .top-contacts {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .top-contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-weight: 500;
    }
    .top-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--brand-gold-light);
      background: rgba(197, 160, 89, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      white-space: nowrap;
    }

    /* --- NAVIGATION & MOBILE DRAWER --- */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo-wrap { display: flex; align-items: center; gap: 12px; }
    
    /* Logo Image Style */
    .brand-logo-img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 50%;
      border: 1.5px solid var(--brand-gold);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
      background-color: #ffffff;
    }
    .brand-logo-img.footer-logo {
      width: 42px;
      height: 42px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-navy);
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-weight: 600;
      font-size: 14px;
      color: var(--brand-slate);
    }
    .nav-links a:hover { color: var(--brand-navy); }
    .btn-nav-quote {
      background: var(--brand-navy);
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: var(--transition);
    }
    .btn-nav-quote:hover {
      background: var(--brand-navy-dark);
    }
    .nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--brand-navy);
    }

    /* Mobile Drawer */
    .mobile-menu {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 16px 20px 24px 20px;
      background: #ffffff;
      border-top: 1px solid var(--card-border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--brand-slate);
      background: #f8fafc;
    }
    .mobile-menu a:active {
      background: var(--brand-navy);
      color: #ffffff;
    }

    /* --- HERO BANNER --- */
    .hero-banner {
      position: relative;
      min-height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 16px;
      overflow: hidden;
      background-color: #0b1a2b;
    }
    .slider-viewport { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
    .slider-frame {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 1.8s ease-in-out, transform 8s ease-out;
    }
    .slider-frame.active { opacity: 1; transform: scale(1); }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.72) 0%, rgba(248, 250, 252, 0.84) 80%);
      z-index: 2;
    }
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }
    .hero-title {
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      color: var(--brand-navy);
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .hero-tagline-blue {
      font-size: clamp(17px, 3.5vw, 24px);
      color: #002244;
      font-weight: 700;
      max-width: 680px;
      margin: 0 auto 30px auto;
    }
    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 30px;
    }
    .btn-hero-primary {
      background: var(--brand-navy);
      color: #ffffff;
      padding: 14px 30px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: var(--radius-sm);
      border: 2px solid var(--brand-navy);
      box-shadow: 0 8px 20px rgba(0, 51, 102, 0.22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Category Cards */
    .category-quick-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .quick-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: left;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .quick-card h4 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--brand-navy);
      margin-bottom: 6px;
    }
    .quick-card p {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .quick-card span {
      font-size: 12px;
      font-weight: 800;
      color: var(--brand-accent);
      text-transform: uppercase;
    }

    /* --- CORPORATE PROFILE & METRICS --- */
    .section-wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .section-header-banner {
      background: linear-gradient(135deg, var(--brand-slate) 0%, var(--brand-navy-deep) 100%);
      color: #ffffff;
      padding: 22px 28px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      border-left: 6px solid var(--brand-gold);
    }
    .section-header-left h2 { font-size: clamp(22px, 4vw, 32px); font-weight: 800; }
    .section-header-left p {
      color: var(--brand-gold-light);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }
    .section-header-right { max-width: 440px; font-size: 13px; color: #cbd5e1; text-align: right; }

    .who-we-are-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 36px;
      align-items: center;
    }
    .corporate-story { font-size: 15px; color: #475569; line-height: 1.8; }
    .corporate-story p { margin-bottom: 16px; }
    .badge-bar { display: flex; flex-wrap: wrap; gap: 10px;
