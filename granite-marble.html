<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz, Porcelain & Thick Monuments | Per Piece | MalviganoMac</title>
  <meta name="description" content="Malvigano Mac Pvt. Ltd. - Specialists in processing and export of premium granite, marble, engineered quartz, porcelain slabs, and monumental stones. Units in Chennai (Tamil Nadu) & Kishangarh (Rajasthan).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-navy: #003366;
      --brand-navy-dark: #002244;
      --brand-navy-deep: #0b1a2b;
      --brand-slate: #2b3a4a;
      --brand-gold: #c5a059;
      --brand-gold-light: #dfbe7d;
      --brand-accent: #b32d2d;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --bg-cream: #fbfbfd;
      --card-border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-soft: 0 10px 30px -5px rgba(0, 51, 102, 0.08);
      --transition: all 0.25s ease-in-out;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-cream);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: 'Cinzel', Georgia, serif; }
    a { text-decoration: none; color: inherit; }

    /* Navigation */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-logo-img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 50%;
      border: 1.5px solid var(--brand-gold);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
      background-color: #ffffff;
    }
    .brand-logo-img.footer-logo { width: 42px; height: 42px; }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-navy);
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-weight: 600;
      font-size: 14px;
      color: var(--brand-slate);
    }
    .nav-links a:hover, .nav-links a.active-link { color: var(--brand-navy); font-weight: 700; }
    .btn-nav-quote {
      background: var(--brand-navy);
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: var(--transition);
    }
    .btn-nav-quote:hover { background: var(--brand-navy-dark); }
    .nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--brand-navy);
    }

    /* Mobile Drawer */
    .mobile-menu {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 16px 20px 24px 20px;
      background: #ffffff;
      border-top: 1px solid var(--card-border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--brand-slate);
      background: #f8fafc;
    }
    .mobile-menu a:active { background: var(--brand-navy); color: #ffffff; }

    /* Info Strip */
    .info-strip {
      background: var(--brand-slate);
      color: #cbd5e1;
      font-size: 13px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
    }
    .info-strip-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .strip-contacts {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .strip-contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
    }
    .strip-separator { color: rgba(255, 255, 255, 0.35); font-size: 11px; }
    .strip-badge-wrap { display: flex; align-items: center; }
    .strip-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
      color: var(--brand-gold-light);
      background: rgba(197, 160, 89, 0.18);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      display: inline-block;
      text-align: center;
      line-height: 1.4;
    }

    /* Catalog Content */
    .catalog-header {
      max-width: 1240px;
      margin: 40px auto 20px auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }
    .catalog-header h1 { font-size: clamp(24px, 4vw, 32px); color: var(--brand-navy); font-weight: 800; }
    .policy-pill {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .grid-container {
      max-width: 1240px;
      margin: 0 auto 80px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 2.3fr 1fr;
      gap: 32px;
    }
    .products-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-soft);
    }
    .card-img { width: 100%; height: 210px; object-fit: cover; }
    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 18px; color: var(--brand-navy); font-weight: 800; margin-bottom: 4px; }
    .dimen-tag {
      font-size: 11.5px;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--brand-slate);
    }
    .price-box { font-size: 22px; font-weight: 800; color: #003366; margin: 8px 0; }
    .price-unit { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    
    .card-ctrl { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
    .sqft-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .btn-add {
      background: var(--brand-navy);
      color: #ffffff;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-add:hover { background: var(--brand-navy-dark); }

    /* Cart Box */
    .cart-box {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
      position: sticky;
      top: 90px;
      height: fit-content;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .cart-box h3 {
      font-size: 20px;
      color: var(--brand-navy);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-weight: 800;
    }
    .cart-items { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .cart-item { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; }
    .split-bill { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 20px; }
